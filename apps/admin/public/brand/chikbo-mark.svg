<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Chikbo">
  <title>Chikbo</title>
  <!--
    Chikbo mark: a charcoal "C" with an orange delivery cart and speed lines
    riding across it. Vector, so it stays crisp from a 16px favicon up to a
    hero lockup. Colours match the brand tokens (ink #232323, orange #F26F1F).
  -->
  <!-- The C: thick ring with a wedge removed on the right -->
  <path d="M163.6 55.9 A78 78 0 1 0 163.6 144.1 L131.4 132.2 A46 46 0 1 1 131.4 67.8 Z"
        fill="#232323" />

  <!-- Speed lines, left of the cart -->
  <g stroke="#F26F1F" stroke-width="11" stroke-linecap="round">
    <line x1="30" y1="79" x2="72" y2="79" />
    <line x1="38" y1="99" x2="70" y2="99" />
    <line x1="46" y1="119" x2="70" y2="119" />
  </g>

  <!-- Cart -->
  <g stroke="#F26F1F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M66 70 H80 L88 94" />
    <path d="M88 94 H156 L144 128 H100 Z" />
  </g>
  <g fill="#F26F1F" stroke="#FFFFFF" stroke-width="5">
    <circle cx="106" cy="146" r="10" />
    <circle cx="139" cy="146" r="10" />
  </g>
</svg>
