# Nginx site for chikbo.com — storefront, admin console and API on one domain.
#
# Install:
#   sudo cp deploy/nginx-chikbo.com.conf /etc/nginx/sites-available/chikbo.com
#   sudo ln -s /etc/nginx/sites-available/chikbo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chikbo.com -d www.chikbo.com     # adds HTTPS + the http→https redirect
#
# The Node process (PM2, port 4000) can serve everything on its own; Nginx is
# in front for HTTPS, compression and to hand out static files directly.

# www → apex, so there is one canonical address.
server {
    listen 80;
    listen [::]:80;
    server_name www.chikbo.com;
    return 301 https://chikbo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name chikbo.com;

    # Product videos can be up to 100 MB.
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # Fingerprinted storefront assets — served straight from disk, cached for a year.
    location /assets/ {
        root /var/www/chikbo/apps/web/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Admin console (static single-page app under /admin).
    location = /admin { return 301 /admin/; }
    location /admin/assets/ {
        alias /var/www/chikbo/apps/admin/dist/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /admin/ {
        alias /var/www/chikbo/apps/admin/dist/admin/;
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # Everything else — API, uploads, webhooks, sitemap, and storefront pages
    # (rendered with per-page SEO tags) — goes to the Node process.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # stream large uploads instead of buffering them
    }
}
