version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chikbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chikbo
      POSTGRES_PASSWORD: chikbo_dev_password
      POSTGRES_DB: chikbo
    ports:
      - "5432:5432"
    volumes:
      - chikbo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chikbo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chikbo_pgdata:
